name: Claude Control Plane

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install --yes jq
      - name: Run deterministic control-plane maintenance
        run: bash evals/maintenance.sh
